name: Release

on:
  push:
    tags: ["v*"]

jobs:
  runtime-assets:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the prebuilt runtime asset
        run: |
          python -m pip install ./shim ./compiler
          python tools/build_rt_asset.py

      - name: Upload runtime asset to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-rt/*.zip

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdists + wheels for both packages
        run: |
          python -m pip install build twine
          python -m build --outdir dist-shim shim
          python -m build --outdir dist-lang compiler
          python -m twine check dist-shim/* dist-lang/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist-shim
          path: dist-shim/

      - uses: actions/upload-artifact@v4
        with:
          name: dist-lang
          path: dist-lang/

  publish-lang:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/serpentine-lang/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-lang
          path: dist/

      - name: Publish serpentine-lang to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-shim:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi-shim
      url: https://pypi.org/project/serpentine-shim/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-shim
          path: dist/

      - name: Publish serpentine-shim to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
