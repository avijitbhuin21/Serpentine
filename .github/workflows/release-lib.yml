name: Release library

# Scoped library releases: pushing a tag like `serp-json-v0.1.0` builds
# libs/serp-json and publishes it to PyPI with the PYPI_API_TOKEN secret
# (account-scoped, so a first upload creates the project). The main
# `v*` tags (release.yml) keep publishing the compiler + shim.

on:
  push:
    tags: ["serp-*-v*"]

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      lib: ${{ steps.derive.outputs.lib }}
      short: ${{ steps.derive.outputs.short }}
    steps:
      - id: derive
        run: |
          LIB="${GITHUB_REF_NAME%-v*}"
          echo "lib=$LIB" >> "$GITHUB_OUTPUT"
          echo "short=${LIB#serp-}" >> "$GITHUB_OUTPUT"

  build-publish:
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LIB: ${{ needs.meta.outputs.lib }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify the tag matches a library directory
        run: |
          if [ ! -d "libs/$LIB" ]; then
            echo "tag $GITHUB_REF_NAME does not match a directory under libs/" >&2
            exit 1
          fi

      - name: Build sdist + wheel
        run: |
          python -m pip install build twine
          python -m build --outdir dist "libs/$LIB"
          python -m twine check dist/*

      - name: Publish to PyPI (account-scoped API token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
