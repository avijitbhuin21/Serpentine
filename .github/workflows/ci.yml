name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Set up CPython 3.12 (spec version pin — see docs/spec.md §1.3)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the shim package
        run: python -m pip install ./shim

      - name: Accept corpus runs clean under CPython
        run: python tools/run_accept_tests.py

      - name: Reject corpus parses and is well-annotated
        run: python tools/check_reject_tests.py

      - name: Install the compiler
        run: python -m pip install ./compiler

      - name: serp check accepts the whole accept corpus
        run: python tools/run_differential_tests.py --check-only

      - name: serp check catches the whole reject corpus with exact codes
        run: python tools/run_reject_serp.py

      - name: LSP server smoke test (diagnostics over stdio)
        run: python tools/run_lsp_smoke.py

      - name: Differential suite (CPython vs native via rustc)
        run: |
          rustc --version
          python tools/run_differential_tests.py

      - name: rustc-agreement harness (borrow checker vs oracle)
        run: python tools/run_rustc_agreement.py

      - name: LLVM backend differential (Backend B, full corpus, native builds)
        run: |
          python -m pip install llvmlite
          python tools/run_llvm_differential.py

      - name: Library differential suite (every libs/*/tests, CPython vs both backends)
        run: python tools/run_lib_tests.py

      - name: Native crash tracebacks match CPython frames (both backends)
        run: python tools/run_traceback_check.py

      - name: Differential parser fuzz (fixed seed, CPython vs native)
        run: python tools/run_fuzz.py --per-kind 300 --seed 20260930

      - name: Differential compiler fuzz (random programs, CPython vs both backends)
        run: python tools/run_compiler_fuzz.py --seed 1 --count 8

      - name: TLS certificate verification against badssl.com (network; informational)
        continue-on-error: true
        run: python tools/run_tls_check.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build serpentine-shim sdist + wheel
        run: |
          python -m pip install build twine
          python -m build shim
          python -m twine check shim/dist/*
