[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serpentine-shim"
version = "0.2.0"
description = "Runtime no-op shim for the Serpentine ownership vocabulary (Owned, Ref, Mut, Shared, Weak, move)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Serpentine contributors" }]
keywords = ["serpentine", "ownership", "borrow-checker", "aot", "compiler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/serpentine-lang/serpentine"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
serpentine = ["py.typed"]
