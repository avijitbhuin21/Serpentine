[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serp-math"
version = "0.1.0"
description = "Serpentine math library: sqrt/sin/cos/tan/log/exp/pow/floor/ceil + pi/e/inf/nan (runtime-backed; delegates to CPython's math when interpreted)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Serpentine contributors" }]
keywords = ["serpentine", "math"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/avijitbhuin21/Serpentine"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["serp_math", "serp_math_core"]
