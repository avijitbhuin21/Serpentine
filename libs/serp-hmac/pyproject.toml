[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serp-hmac"
version = "0.1.0"
description = "Serpentine hmac drop-in: keyed HMAC-SHA256/SHA1/MD5 and constant-time compare_digest (runtime-backed; stdlib delegate under CPython)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Serpentine contributors" }]
keywords = ["serpentine", "hmac", "crypto"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["serpentine-shim", "serp-hashlib>=0.2.0"]

[project.urls]
Homepage = "https://github.com/avijitbhuin21/Serpentine"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["serp_hmac"]
