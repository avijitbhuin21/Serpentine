[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serp-scales"
version = "0.2.1"
description = "Scales: pandas drop-in DataFrame/Series for Serpentine (pure Serpentine, PyVal columns; groupby, pivot, rolling, query, merge, concat, datetime, CSV/JSON)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Serpentine contributors" }]
keywords = ["serpentine", "pandas", "dataframe"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["serpentine-shim>=0.8.0", "serp-json>=0.3.0", "serp-datetime>=0.4.0"]

[project.urls]
Homepage = "https://github.com/avijitbhuin21/Serpentine"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["serp_scales"]
