[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serp-queue"
version = "0.1.0"
description = "Serpentine drop-in `queue`: thread-safe Queue/LifoQueue with blocking put/get, timeouts, task_done/join (runtime-backed; stdlib queue delegate under CPython)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Serpentine contributors" }]
keywords = ["serpentine", "queue", "threading"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/avijitbhuin21/Serpentine"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["serp_queue", "serp_queue_core"]
