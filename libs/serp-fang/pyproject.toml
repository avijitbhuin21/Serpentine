[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serp-fang"
version = "0.2.0"
description = "Fang — Serpentine's httpx-style sync HTTP(S) client: Client/Response/stream, redirects, cookies, auth, forms, JSON, multipart, gzip, streamed downloads (pure Serpentine over serp-socket TLS, dual-runs under CPython)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Serpentine contributors" }]
keywords = ["serpentine", "http", "client", "fang"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["serpentine-shim", "serp-socket", "serp-url", "serp-base64", "serp-json", "serp-io"]

[project.urls]
Homepage = "https://github.com/avijitbhuin21/Serpentine"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["serp_fang"]
